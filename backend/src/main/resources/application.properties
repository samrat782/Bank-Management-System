# =====================================================================
# SecureTrust Bank - application.properties
# Update spring.datasource.username / password to match YOUR local
# MySQL installation before running the app.
# =====================================================================

spring.application.name=banking-management-system

# ---------- Server ----------
server.port=8080

# ---------- MySQL Datasource ----------
# Make sure you have already run database/schema.sql in MySQL once.
spring.datasource.url=jdbc:mysql://localhost:3306/banking_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# 'update' will auto-align entities with the tables created by schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# 64+ char secret used to sign tokens. Change this for production use.
app.jwt.secret=SecureTrustBankSuperSecretKeyForJwtSigningChangeThisInProduction123456
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
# Origin(s) allowed to call this API from the browser (the frontend).
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501,http://127.0.0.1:5502,http://localhost:5502,http://localhost:3000,null

# ---------- Logging ----------
logging.level.com.securetrust.banking=INFO
